name: Build (on pull request)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Quick build (no test, Java 17)
  # Artifacts will be reused in the other jobs
  quick-build:
    name: Quick Build
    runs-on: runs-on=${{ github.run_id }}/runner=linux
    # Skip draft PRs, rerun as soon as its removed
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.draft == false &&
        github.event.pull_request.state != 'closed' &&
        github.event.action != 'edited'
      )
    outputs:
      all_modules: ${{ steps.matrices.outputs.all_modules }}
      it_modules: ${{ steps.matrices.outputs.it_modules }}
      in_process_embedding_modules: ${{ steps.matrices.outputs.in_process_embedding_modules }}
      run_mcp_conformance: ${{ steps.matrices.outputs.run_mcp_conformance }}
      scalpel_impacted: ${{ steps.matrices.outputs.scalpel_impacted }}

    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4
        with:
          # Full history so Scalpel and git diff can compare against the base branch
          fetch-depth: 0

      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean install -DskipTests -Dno-format -ntp

      - name: Compute impacted set
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          IMPACTED="$GITHUB_WORKSPACE/impacted.txt"
          rm -f target/scalpel-report.json

          # Escape hatch: ci/disable-scalpel label, or a backport source branch -> full build.
          # (Release-branch bases are handled by Scalpel's own -Dscalpel.disableOnBaseBranch below.)
          DISABLE=false
          if echo "$PR_LABELS" | jq -e 'index("ci/disable-scalpel")' >/dev/null 2>&1; then
            DISABLE=true
          fi
          if [[ "$HEAD_REF" == *backport* ]]; then
            DISABLE=true
          fi

          if [ "$DISABLE" = "true" ]; then
            echo "Scalpel disabled (label or backport branch) -> full build"
            echo "ALL" > "$IMPACTED"
            exit 0
          fi

          # Run Scalpel in report mode. Scalpel is disabled by default (.mvn/maven.config: scalpel.enabled=false)
          # so every other Maven invocation is inert; we enable it only here for the report.
          # Activate the jdk21-plus/jdk25-plus profiles so jitllm/jinfer are in the reactor Scalpel analyzes
          # (it runs on JDK 17); otherwise a change upstream of them (e.g. core) would leave them out of the
          # impacted set and they'd never be tested on JDK 21/25. enforcer.skip is required because jinfer's
          # enforcer demands JDK 25; report mode only reads the reactor model and compiles nothing.
          # disableOnBaseBranch makes Scalpel force a full build when the PR targets a release branch (\d+.\d+).
          # Non-fatal: on error, leave no report so the empty check below fails safe to a full build.
          ./mvnw -q -Dscalpel.enabled=true -Dincremental -Dscalpel.mode=report \
            -Pjdk21-plus,jdk25-plus -Denforcer.skip=true \
            -Dscalpel.baseBranch="origin/${BASE_REF}" \
            -Dscalpel.disableOnBaseBranch='\d+\.\d+' \
            -Dscalpel.reportFile=target/scalpel-report.json validate \
            || echo "Scalpel report generation failed; will fail safe to a full build"

          # Missing report (tool error) or an explicit full-build signal -> full build.
          # fullBuildTriggered covers release-branch disable and disableTriggers.
          if [ ! -f target/scalpel-report.json ] || \
             [ "$(jq -r '.fullBuildTriggered // false' target/scalpel-report.json)" = "true" ]; then
            echo "ALL" > "$IMPACTED"
            echo "Impacted set: ALL"
            exit 0
          fi

          # Impacted = affected modules, excluding upstream-only (they don't need testing).
          # jitllm/jinfer are reported natively because the jdk profiles were active above.
          COMBINED=$(jq -r '.affectedModules[] | select(.category != "UPSTREAM") | .path' target/scalpel-report.json \
            | sed '/^$/d' | sort -u)

          # Nothing impacted -> fail safe to a full build (never skip everything).
          if [ -z "$COMBINED" ]; then
            echo "ALL" > "$IMPACTED"
          else
            printf '%s\n' "$COMBINED" > "$IMPACTED"
          fi
          echo "Impacted set:"; cat "$IMPACTED"

      - name: Zip the Maven repo
        run: |
          tar -czf ${{ runner.temp }}/maven-repo.tgz -C ~ .m2/repository
          # Avoid caching our own artifacts
          rm -Rf ~/.m2/repository/io/quarkiverse/langchain4j

      - name: Persist the Maven repo
        uses: actions/upload-artifact@v4
        with:
          name: maven-repo
          path: ${{ runner.temp }}/maven-repo.tgz
          retention-days: 5

      - name: Compute matrices
        id: matrices
        run: |
          IMPACTED="$GITHUB_WORKSPACE/impacted.txt"
          FILTER="$GITHUB_WORKSPACE/.github/filter-modules.sh"

          # Compute the JVM tests
          ALL_MODULES=$(find . -mindepth 2 -maxdepth 2 -type f -name 'pom.xml' -exec dirname {} \; \
                | sed 's|^\./||' \
                | sort -u \
                | jq -R -s -c 'split("\n")[:-1]')
          ALL_MODULES=$(bash "$FILTER" "$IMPACTED" "" "$ALL_MODULES")

          # Integration tests (without the in-process embedding models)
          # Remove Jinfer and JitLLM from the list
          cd integration-tests
          IT_MODULES=$( \
              find . -mindepth 2 -maxdepth 2 -type f -name 'pom.xml' -exec dirname {} \; \
                | sed 's|^\./||' \
                | sort -u \
                | grep -v jinfer \
                | grep -v jitllm \
                | grep -v mcp-conformance \
                | grep -v in-process-embedding-models \
                | jq -R -s -c 'split("\n")[:-1]')
          IT_MODULES=$(bash "$FILTER" "$IMPACTED" "integration-tests" "$IT_MODULES")

          # We extract in process embedding models as there are many modules and we want parallelism
          cd in-process-embedding-models
          IN_PROCESS_EMBEDDING_MODULES=$( \
              find . -mindepth 2 -maxdepth 2 -type f -name 'pom.xml' -exec dirname {} \; \
                | sed 's|^\./||' \
                | sort -u \
                | jq -R -s -c 'split("\n")[:-1]')
          IN_PROCESS_EMBEDDING_MODULES=$(bash "$FILTER" "$IMPACTED" "integration-tests/in-process-embedding-models" "$IN_PROCESS_EMBEDDING_MODULES")

          # MCP conformance: run when its module (or anything upstream of it) is impacted
          MCP=$(bash "$FILTER" "$IMPACTED" "integration-tests" '["mcp-conformance"]')
          if [ "$MCP" = "[]" ]; then RUN_MCP=false; else RUN_MCP=true; fi

          # Impacted module paths (root-relative, space-separated) or ALL, consumed by jvm-tests for -pl narrowing
          if [ "$(cat "$IMPACTED")" = "ALL" ]; then
            SCALPEL_IMPACTED=ALL
          else
            SCALPEL_IMPACTED=$(tr '\n' ' ' < "$IMPACTED")
          fi

          echo "all_modules=${ALL_MODULES}" >> $GITHUB_OUTPUT
          echo "it_modules=${IT_MODULES}" >> $GITHUB_OUTPUT
          echo "in_process_embedding_modules=${IN_PROCESS_EMBEDDING_MODULES}" >> $GITHUB_OUTPUT
          echo "run_mcp_conformance=${RUN_MCP}" >> $GITHUB_OUTPUT
          echo "scalpel_impacted=${SCALPEL_IMPACTED}" >> $GITHUB_OUTPUT

      # Publish build reports
      - name: Prepare build reports archive
        if: always()
        run: |
          7z a -tzip build-reports.zip -r \
              'target/build-report.json' \
              LICENSE
      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "build-reports-${{ github.run_attempt }}-Quick Build"
          path: |
            build-reports.zip
          retention-days: 7

  documentation-check:
    name: Documentation check
    runs-on: runs-on=${{ github.run_id }}/runner=linux

    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4

      - name: Validate guide metadata
        run: |
          MISSING=$(for f in docs/modules/ROOT/pages/*.adoc; do
            awk '/^$/{exit} /^:extensions:/{found=1} END{exit !found}' "$f" || echo "$f"
          done)
          if [ -n "$MISSING" ]; then
            echo "These guides have no :extensions: attribute in their header:"
            echo "$MISSING"
            echo "Add it right below the title, before the first blank line, e.g.:"
            echo "  :extensions: io.quarkiverse.langchain4j:quarkus-langchain4j-core"
            echo "It sets the source of the guide's chunks in the documentation RAG artifact."
            exit 1
          fi

      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build with Maven
        run: ./mvnw -B clean install -DskipTests -Dno-format -ntp

      - name: Validate documentation
        run: |
          STATUS=$(git status --porcelain docs/modules/ROOT/pages/includes/)
          if [ -n "$STATUS" ]; then
            echo "Generated documentation is not up to date."
            echo "'git status' output after rebuilding the docs:"
            git status
            echo "To fix this (make sure you use JDK 22+ so that all modules are activated):"
            echo "  1. Run: mvn clean install"
            echo "  2. Commit the generated documentation files"
            exit 1
          else
            echo "Generated documentation is up to date."
          fi

  jvm-tests:
    needs: quick-build
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
        module: ${{fromJson(needs.quick-build.outputs.all_modules)}}
    name: JVM tests - ${{ matrix.module }} - Java ${{ matrix.java }}
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index }}/runner=linux
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup JBang
        uses: jbangdev/setup-jbang@main

      - name: Download the Maven repo
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ..
      - name: Unzip the Maven Repo
        shell: bash
        run: |
          tar -xzf ../maven-repo.tgz -C ~

      # Build JitLLM if JDK >= 21
      # It's not build by default as it requires Java 21+
      - name: Build JitLLM extension
        if: ${{ matrix.java >= 21 }}
        run: |
          ./mvnw -B clean install -DskipTests -Dno-format -ntp -f model-providers/jitllm/pom.xml

      # Build Jinfer if JDK >= 25. It requires Java 25 (Qxotic jinfer floor) and is not built by default.
      - name: Build Jinfer extension
        if: ${{ matrix.java >= 25 }}
        run: |
          ./mvnw -B clean install -DskipTests -Dno-format -ntp -f model-providers/jinfer/pom.xml

      - name: Run tests of ${{ matrix.module }} with JDK ${{ matrix.java }}
        env:
          SCALPEL_IMPACTED: ${{ needs.quick-build.outputs.scalpel_impacted }}
          MODULE: ${{ matrix.module }}
        run: |
          # Narrow the aggregator build to the impacted submodules (-pl), like Quarkus.
          # SCALPEL_IMPACTED holds root-relative module paths (or ALL). We keep the ones under this
          # aggregator and strip the prefix (model-providers/mistral/runtime -> mistral/runtime).
          PL_ARGS=""
          if [ "$SCALPEL_IMPACTED" != "ALL" ]; then
            PL=""
            for p in $SCALPEL_IMPACTED; do
              case "$p" in
                "$MODULE"/*) PL="${PL:+$PL,}${p#"$MODULE"/}" ;;
              esac
            done
            # jitllm/jinfer are JDK-gated: their reactor membership varies by JDK and -pl on an absent
            # module hard-fails. If the impacted set under this aggregator includes one, build the whole
            # aggregator and let the JDK profiles include/exclude them correctly.
            if printf '%s' "$PL" | grep -qE '(^|,)(jitllm|jinfer)(/|,|$)'; then
              echo "JDK-gated module impacted under $MODULE -> building the full aggregator"
            elif [ -n "$PL" ]; then
              PL_ARGS="-pl $PL"
            fi
          fi
          echo "Running: cd $MODULE && mvnw verify ${PL_ARGS:-(full aggregator)}"
          cd "$MODULE" && ../mvnw -B verify -Dci=true -Dno-format -ntp $PL_ARGS

      # Publish build reports
      - name: Prepare build reports archive
        if: always()
        run: |
          7z a -tzip build-reports.zip -r \
              '**/target/*-reports/TEST-*.xml' \
              'target/build-report.json' \
              LICENSE
      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "build-reports-${{ github.run_attempt }}-JVM tests - ${{ matrix.module }} - Java ${{ matrix.java }}"
          path: |
            build-reports.zip
          retention-days: 7

  native-tests:
    needs: quick-build
    # An empty matrix is a GitHub config error (not a clean skip), so guard against no impacted IT modules
    if: needs.quick-build.outputs.it_modules != '[]'
    name: Native tests - ${{matrix.module}}
    strategy:
      fail-fast: false
      matrix:
        module: ${{fromJson(needs.quick-build.outputs.it_modules)}}
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index }}/runner=linux
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup JBang
        uses: jbangdev/setup-jbang@main

      - name: Download the Maven repo
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ..
      - name: Unzip the Maven Repo
        shell: bash
        run: |
          tar -xzf ../maven-repo.tgz -C ~

      - name: Run integration tests ${{matrix.module}}
        run: |
          cd integration-tests/${{matrix.module}} && ../../mvnw -B verify -Dnative -Dci=true -Dquarkus.native.container-build -Dnative.surefire.skip -Dno-format -ntp

      # Publish build reports
      - name: Prepare build reports archive
        if: always()
        run: |
          7z a -tzip build-reports.zip -r \
              '**/target/*-reports/TEST-*.xml' \
              'target/build-report.json' \
              LICENSE
      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "build-reports-${{ github.run_attempt }}-Native tests - ${{matrix.module}}"
          path: |
            build-reports.zip
          retention-days: 7

  in-process-embedding-model-tests:
    needs: quick-build
    # An empty matrix is a GitHub config error (not a clean skip), so guard against no impacted modules
    if: needs.quick-build.outputs.in_process_embedding_modules != '[]'
    name: In process embedding model tests - ${{matrix.module}}
    strategy:
      fail-fast: false
      matrix:
        module: ${{fromJson(needs.quick-build.outputs.in_process_embedding_modules)}}
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index }}/runner=linux
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download the Maven repo
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ..
      - name: Unzip the Maven Repo
        shell: bash
        run: |
          tar -xzf ../maven-repo.tgz -C ~

      - name: Run integration tests ${{matrix.module}}
        run: |
          cd integration-tests/in-process-embedding-models/${{matrix.module}}
          ../../../mvnw -B verify -Dnative -Dquarkus.native.container-build -Dci=true -Dnative.surefire.skip -Dno-format -ntp

      # Publish build reports
      - name: Prepare build reports archive
        if: always()
        run: |
          7z a -tzip build-reports.zip -r \
              '**/target/*-reports/TEST-*.xml' \
              'target/build-report.json' \
              LICENSE
      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "build-reports-${{ github.run_attempt }}-In process embedding model tests - ${{matrix.module}}"
          path: |
            build-reports.zip
          retention-days: 7

  mcp-conformance-tests:
    needs: quick-build
    if: needs.quick-build.outputs.run_mcp_conformance == 'true'
    name: MCP Conformance tests
    runs-on: runs-on=${{ github.run_id }}/runner=linux
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v4

      # ubuntu-latest comes with Node 20, but MCP conformance tests require 24
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download the Maven repo
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ..
      - name: Unzip the Maven Repo
        shell: bash
        run: |
          tar -xzf ../maven-repo.tgz -C ~

      - name: Prepare for conformance tests
        run: |
          ./mvnw package -pl integration-tests/mcp-conformance -Dquarkus-langchain4j.version=999-SNAPSHOT
          npm audit fix

      - name: Run MCP conformance tests
        run: |
          cd integration-tests/mcp-conformance
          npm -y exec -- @modelcontextprotocol/conformance@0.1.16 client --command "sh client-command.sh" --suite all --expected-failures conformance-baseline.yml


  build-report:
    runs-on: runs-on=${{ github.run_id }}/runner=linux
    name: Build report
    needs: [quick-build, jvm-tests, native-tests, in-process-embedding-model-tests]
    if: always()
    steps:
      - uses: runs-on/action@v2

      - uses: actions/download-artifact@v4
        with:
          path: build-reports-artifacts
          pattern: "build-reports-${{ github.run_attempt }}-"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Produce report and add it as job summary
        uses: quarkusio/action-build-reporter@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-reports-artifacts-path: build-reports-artifacts
          # Branch protection requires the 'CI Merge Gate' commit status, posted by ci-merge-gate.yml
          # based on this workflow's conclusion (see that file). No per-workflow gate job is needed.
