quarkus.langchain4j.openai.chat-model.model-name=gpt-4.1
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.timeout=60s

# A cheaper model, used by the default profile to summarize old turns
quarkus.langchain4j.openai.summarizer.chat-model.model-name=gpt-4.1-mini
quarkus.langchain4j.openai.summarizer.chat-model.temperature=0
quarkus.langchain4j.openai.summarizer.api-key=${QUARKUS_LANGCHAIN4J_OPENAI_API_KEY:}

# --- Default profile, used by SummarizingAssistant.
# Prune old tool outputs, collapse repeated tool calls, summarize old turns, and drop turns as a last resort.
# The 8k window is deliberately small so the ~14k-token replayed conversation must be compacted.
quarkus.langchain4j.compaction.strategy=pipeline
quarkus.langchain4j.compaction.pipeline.steps=tool-output-pruning,duplicate-collapse,rolling-summary,token-window
quarkus.langchain4j.compaction.budget.context-window=8000
quarkus.langchain4j.compaction.budget.reserved-completion-tokens=1000
quarkus.langchain4j.compaction.summary.model-name=summarizer
quarkus.langchain4j.compaction.summary.keep-last-turns=4
quarkus.langchain4j.compaction.tool-output-pruning.keep-last-turns=2

# --- "window" profile, used by WindowAssistant (@CompactionProfile("window")).
# Named profiles do not inherit from the default profile. Same budget, but only keeps the most recent turns:
# no model call, but early facts are lost.
quarkus.langchain4j.compaction.profiles.window.strategy=token-window
quarkus.langchain4j.compaction.profiles.window.budget.context-window=8000
quarkus.langchain4j.compaction.profiles.window.budget.reserved-completion-tokens=1000

# --- Evaluation (CompactionEvaluationTest): a separate model grades the answers
%test.quarkus.langchain4j.openai.judge.chat-model.model-name=gpt-4.1
%test.quarkus.langchain4j.openai.judge.chat-model.temperature=0
%test.quarkus.langchain4j.openai.judge.api-key=${QUARKUS_LANGCHAIN4J_OPENAI_API_KEY:}

# --- Strategy evaluation (StrategyEvaluationTest): one profile per strategy, test mode only.
# Same budget for all: the ~8.6k-token outage conversation must be compacted several times.
# usable = 6000 - 1000 = 5000 tokens, trigger at 4000, target 3000.
# Summaries use the "summarizer" model configured above (summary.model-name applies to every profile).
%test.quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small

%test.quarkus.langchain4j.compaction.profiles.token-window.strategy=token-window
%test.quarkus.langchain4j.compaction.profiles.token-window.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.token-window.budget.reserved-completion-tokens=1000

%test.quarkus.langchain4j.compaction.profiles.message-window.strategy=message-window
%test.quarkus.langchain4j.compaction.profiles.message-window.message-window.max-messages=20
%test.quarkus.langchain4j.compaction.profiles.message-window.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.message-window.budget.reserved-completion-tokens=1000

%test.quarkus.langchain4j.compaction.profiles.tool-output-pruning.strategy=tool-output-pruning
%test.quarkus.langchain4j.compaction.profiles.tool-output-pruning.tool-output-pruning.keep-last-turns=2
%test.quarkus.langchain4j.compaction.profiles.tool-output-pruning.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.tool-output-pruning.budget.reserved-completion-tokens=1000

%test.quarkus.langchain4j.compaction.profiles.rolling-summary.strategy=rolling-summary
%test.quarkus.langchain4j.compaction.profiles.rolling-summary.summary.keep-last-turns=4
%test.quarkus.langchain4j.compaction.profiles.rolling-summary.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.rolling-summary.budget.reserved-completion-tokens=1000

%test.quarkus.langchain4j.compaction.profiles.anchored-summary.strategy=anchored-summary
%test.quarkus.langchain4j.compaction.profiles.anchored-summary.summary.keep-last-turns=4
%test.quarkus.langchain4j.compaction.profiles.anchored-summary.summary.anchor-turns=1
%test.quarkus.langchain4j.compaction.profiles.anchored-summary.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.anchored-summary.budget.reserved-completion-tokens=1000

# the conversation spans 14:12 to 16:45: turns before 14:45 are summarized, turns after 16:30 kept verbatim
%test.quarkus.langchain4j.compaction.profiles.time-decay.strategy=time-decay
%test.quarkus.langchain4j.compaction.profiles.time-decay.time-decay.recent=15m
%test.quarkus.langchain4j.compaction.profiles.time-decay.time-decay.stale=2h
%test.quarkus.langchain4j.compaction.profiles.time-decay.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.time-decay.budget.reserved-completion-tokens=1000

%test.quarkus.langchain4j.compaction.profiles.relevance.strategy=relevance
%test.quarkus.langchain4j.compaction.profiles.relevance.relevance.keep-last-turns=3
%test.quarkus.langchain4j.compaction.profiles.relevance.relevance.top-k=4
%test.quarkus.langchain4j.compaction.profiles.relevance.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.relevance.budget.reserved-completion-tokens=1000

%test.quarkus.langchain4j.compaction.profiles.pipeline.strategy=pipeline
%test.quarkus.langchain4j.compaction.profiles.pipeline.pipeline.steps=tool-output-pruning,duplicate-collapse,rolling-summary,token-window
%test.quarkus.langchain4j.compaction.profiles.pipeline.tool-output-pruning.keep-last-turns=2
%test.quarkus.langchain4j.compaction.profiles.pipeline.summary.keep-last-turns=4
%test.quarkus.langchain4j.compaction.profiles.pipeline.budget.context-window=6000
%test.quarkus.langchain4j.compaction.profiles.pipeline.budget.reserved-completion-tokens=1000
