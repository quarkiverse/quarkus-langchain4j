quarkus.langchain4j.openai.chat-model.model-name=gpt-4.1
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.timeout=60s

# A cheaper model, used by the default profile to summarize old turns
quarkus.langchain4j.openai.summarizer.chat-model.model-name=gpt-4.1-mini
quarkus.langchain4j.openai.summarizer.chat-model.temperature=0
quarkus.langchain4j.openai.summarizer.api-key=${QUARKUS_LANGCHAIN4J_OPENAI_API_KEY:}

# --- Default profile, used by SummarizingAssistant.
# Prune old tool outputs, collapse repeated tool calls, summarize old turns, and drop turns as a last resort.
# The 8k window is deliberately small so the ~14k-token replayed conversation must be compacted.
quarkus.langchain4j.compaction.strategy=pipeline
quarkus.langchain4j.compaction.pipeline.steps=tool-output-pruning,duplicate-collapse,rolling-summary,token-window
quarkus.langchain4j.compaction.budget.context-window=8000
quarkus.langchain4j.compaction.budget.reserved-completion-tokens=1000
quarkus.langchain4j.compaction.summary.model-name=summarizer
quarkus.langchain4j.compaction.summary.keep-last-turns=4
quarkus.langchain4j.compaction.tool-output-pruning.keep-last-turns=2

# --- "window" profile, used by WindowAssistant (@CompactionProfile("window")).
# Named profiles do not inherit from the default profile. Same budget, but only keeps the most recent turns:
# no model call, but early facts are lost.
quarkus.langchain4j.compaction.profiles.window.strategy=token-window
quarkus.langchain4j.compaction.profiles.window.budget.context-window=8000
quarkus.langchain4j.compaction.profiles.window.budget.reserved-completion-tokens=1000
