# Required: dimension of the embedding model.
# The default OpenAI embedding model (text-embedding-ada-002 / text-embedding-3-small)
# produces 1536-dimensional vectors. Adjust it if you configure a different model.
quarkus.langchain4j.infinispan.dimension=1536

# Your OpenAI API key (or export the OPENAI_API_KEY environment variable instead).
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:YOUR_OPENAI_API_KEY}

# Quarkus dev services automatically starts an Infinispan server inside a Docker
# container. Make sure Docker is installed and running before launching the app:
#   ./mvnw -pl samples/infinispan-embedding-store quarkus:dev
quarkus.infinispan-client.devservices.enabled=true
