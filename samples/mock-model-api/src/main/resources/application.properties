quarkus.langchain4j.openai.chat-model.model-name=gpt-6-luna
quarkus.langchain4j.openai.chat-model.temperature=0
# send the JSON schema of the return type of SupportAssistant.triage with the request
quarkus.langchain4j.openai.chat-model.response-format=json_schema

# The mock model API is opt-in. Enabled for the tests and for dev mode, every model of the application is pointed at
# it, and the missing OpenAI API key is filled in with a placeholder. The packaged application is not affected: the
# extension is a provided dependency, and the flag is off in the prod profile.
%test.quarkus.langchain4j.mock-api.enabled=true
%dev.quarkus.langchain4j.mock-api.enabled=true

# What the mock answers in dev mode when nothing has been queued through its admin API
%dev.quarkus.langchain4j.mock-api.default-chat-reply=This is the mock talking. Queue a reply through the admin API to change this answer.
