quarkus.http.port=11010
quarkus.http.host=127.0.0.1
quarkus.otel.enabled=false
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:qwen2.5:7b}
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.a2a.apicurio-registry.url=${REGISTRY_URL:http://localhost:8180/apis/registry/v3}
quarkus.langchain4j.a2a.apicurio-registry.agent-url=${AGENT_URL:http://localhost:${quarkus.http.port}}
# No identity provider in this localhost-only sample. Never use this setting for a shared deployment.
a2a.authorization.required=false
agent.name=summarizer
agent.description=Summarizes text into a short factual paragraph
agent.instruction=Summarize the supplied text in at most three sentences. Preserve the facts. Return only the summary.
%translator.quarkus.http.port=11030
%translator.agent.name=translator
%translator.agent.description=Translates text into French
%translator.agent.instruction=Translate the supplied text into French. Preserve meaning and facts. Return only the translation.
