services:
  registry:
    image: quay.io/apicurio/apicurio-registry:3.3.3
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
      APICURIO_FEATURES_EXPERIMENTAL_ENABLED: "true"
    # Ephemeral, localhost-only, no authentication. Use a dedicated instance for the demo.
