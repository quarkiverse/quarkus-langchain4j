# --- Model provider: JitLLM (see the README to use Ollama or OpenAI instead) ---

# Qwen3.8 27B, 4-bit. The model file is 16 GB, so this needs a GPU with 24 GB.
quarkus.langchain4j.jitllm.chat-model.model-name=unsloth/Qwen3.8-27B-GGUF
quarkus.langchain4j.jitllm.chat-model.quantization=Q4_0

# A review should stay close to the diff
quarkus.langchain4j.jitllm.chat-model.temperature=0.2
quarkus.langchain4j.jitllm.chat-model.top-p=0.95

# Reasoning before answering. It makes a review slower, but without it the model misreads diffs
# more often. The reasoning is printed, dimmed, before the review.
quarkus.langchain4j.jitllm.chat-model.enable-thinking=true

# Also the context length: the prompt (description and diff), the reasoning and the review must fit
# in it together. The default diff budget, 60000 characters, is roughly 15-20k tokens.
quarkus.langchain4j.jitllm.chat-model.max-tokens=32768

# The prompt is a whole diff, so read it 512 tokens at a time
quarkus.langchain4j.jitllm.chat-model.prefill-decode=true
quarkus.langchain4j.jitllm.chat-model.prefill-batch-size=512

# Model weights plus the key/value cache for max-tokens
quarkus.langchain4j.jitllm.chat-model.device-memory=22GB

# The streaming model logs the whole response once it completes, after it has been printed
quarkus.log.category."io.quarkiverse.langchain4j.jitllm.JitLLMStreamingChatModel".level=WARN

# --- GitHub API ---

# The token is optional: public pull requests work without it, within the unauthenticated rate
# limit of 60 requests per hour (a review makes two).
github.token=${GITHUB_TOKEN:}

# --- Application ---

quarkus.banner.enabled=false
