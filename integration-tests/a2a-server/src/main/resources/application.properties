quarkus.langchain4j.a2a.server.name=Weather Agent
quarkus.langchain4j.a2a.server.description=Answers questions about the weather
quarkus.langchain4j.a2a.server.version=1.2.3

# The Agent Card advertises one URL for every interface, so gRPC has to answer on the HTTP server's port too
quarkus.grpc.server.use-separate-server=false

# Every caller may read every task: these tests send as anonymous clients and supply no TaskAuthorizationProvider
a2a.authorization.required=false
