# The application tested in native mode by McpTracingNativeIT. Everything is in the prod profile,
# so that it doesn't affect the QuarkusUnitTest tests, which run in the test profile.

%prod.quarkus.langchain4j.mcp.stdio.transport-type=stdio
%prod.quarkus.langchain4j.mcp.stdio.command=jbang,--quiet,--fresh,run,src/test/resources/tracing_mcp_server.java

%prod.quarkus.langchain4j.mcp.http.transport-type=streamable-http
%prod.quarkus.langchain4j.mcp.http.url=http://localhost:8283/mcp

# export the spans right away
%prod.quarkus.otel.bsp.schedule.delay=PT0.001S
%prod.quarkus.otel.bsp.max.export.batch.size=1
