quarkus.langchain4j.embedding-model.provider=dev.langchain4j.model.embedding.onnx.allminilml6v2.AllMiniLmL6V2EmbeddingModel

quarkus.langchain4j.oracle.create-option=CREATE_OR_REPLACE

quarkus.langchain4j.oracle.vector-index.create-option=CREATE_OR_REPLACE
quarkus.langchain4j.oracle.vector-index.target-accuracy=95

quarkus.langchain4j.oracle.metadata-indexes[0].create-option=CREATE_OR_REPLACE
quarkus.langchain4j.oracle.metadata-indexes[0].keys[0].key=userId
quarkus.langchain4j.oracle.metadata-indexes[0].keys[0].type=STRING
quarkus.langchain4j.oracle.metadata-indexes[0].keys[1].key=year
quarkus.langchain4j.oracle.metadata-indexes[0].keys[1].type=INTEGER

quarkus.langchain4j.oracle.products.enabled=true
quarkus.langchain4j.oracle.products.create-option=CREATE_OR_REPLACE
quarkus.langchain4j.oracle.products.table=product_embeddings
