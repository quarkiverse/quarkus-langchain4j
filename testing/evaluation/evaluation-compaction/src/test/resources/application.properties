# default profile: no compaction, the view is the full history
quarkus.langchain4j.compaction.enabled=false
# a small window that forgets the beginning of the conversation
quarkus.langchain4j.compaction.profiles.window.strategy=message-window
quarkus.langchain4j.compaction.profiles.window.message-window.max-messages=4
quarkus.langchain4j.compaction.profiles.window.budget.context-window=400
quarkus.langchain4j.compaction.profiles.window.budget.reserved-completion-tokens=0
# no compaction, but messages older than an hour (on the replayed clock) are deleted
quarkus.langchain4j.compaction.profiles.retention.enabled=false
quarkus.langchain4j.compaction.profiles.retention.retention.max-age=1h
