quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
# a value the user configures must win over the mock's identity placeholder
quarkus.langchain4j.openai.api-key=my-own-key
# two providers: OpenAI serves the unnamed model, Mistral the named model m1
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.m1.chat-model.provider=mistralai
# a key from a variable that is not set gets the placeholder, as without the key, instead of failing the start
quarkus.langchain4j.mistralai.m1.api-key=${MOCK_API_APP_TESTS_UNSET_KEY}
